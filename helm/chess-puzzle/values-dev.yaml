backend:
  replicaCount: 1
  image:
    repository: 428194419624.dkr.ecr.us-east-1.amazonaws.com/chess-puzzle-backend
    tag: latest
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  hpa:
    enabled: false

frontend:
  replicaCount: 1
  image:
    repository: 428194419624.dkr.ecr.us-east-1.amazonaws.com/chess-puzzle-frontend
    tag: latest
  service:
    type: LoadBalancer
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

postgres:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  storage:
    size: 1Gi
    storageClass: gp2

ingress:
  annotations:
    kubernetes.io/ingress.class: nginx

networkPolicy:
  enabled: false
