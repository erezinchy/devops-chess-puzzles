namespace: chess-puzzle

backend:
  replicaCount: 2
  image:
    repository: chess-puzzle-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 3001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPU: 70
    targetMemory: 80
  env:
    port: "3001"
    dbPort: "5432"
    dbName: "chess_puzzles"

frontend:
  replicaCount: 2
  image:
    repository: chess-puzzle-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 1Gi
    storageClass: ""

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
  tls: []

networkPolicy:
  enabled: true

secrets:
  dbCredentials: db-credentials
  appSecrets: app-secrets
