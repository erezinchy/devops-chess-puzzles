backend:
  replicaCount: 3
  image:
    repository: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/chess-puzzle-backend
    tag: prod-latest
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPU: 70
    targetMemory: 80

frontend:
  replicaCount: 2
  image:
    repository: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/chess-puzzle-frontend
    tag: prod-latest
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

postgres:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: gp3

ingress:
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"

networkPolicy:
  enabled: true
