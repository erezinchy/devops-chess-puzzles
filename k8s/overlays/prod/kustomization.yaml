apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
  - path: frontend-patch.yaml
  - path: postgres-patch.yaml
  - path: ingress-patch.yaml

images:
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/chess-puzzle-backend
    newTag: prod-latest
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/chess-puzzle-frontend
    newTag: prod-latest
