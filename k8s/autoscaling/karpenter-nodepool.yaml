apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: chess-puzzle-pool
spec:
  template:
    metadata:
      labels:
        app-workload: chess-puzzle
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t3.small
            - t3.medium
            - t3a.small
            - t3a.medium
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: chess-puzzle-nodes
  limits:
    cpu: "16"
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
  weight: 50
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: chess-puzzle-nodes
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: chess-puzzle-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: chess-puzzle-cluster
  role: KarpenterNodeRole-chess-puzzle-cluster
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
